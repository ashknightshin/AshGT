<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Growfaxs</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#13131b;--line:#252533;--mut:#9a9aae;--acc:#00cfff;--gold:#ffb100;--ok:#19e08a}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,system-ui,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(1100px 600px at 75% -10%,#2b1242,transparent 60%),var(--bg)}
nav{position:sticky;top:0;z-index:5;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;padding:18px 12px;background:#000c;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
nav a{color:var(--mut);text-decoration:none;font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
nav a.on{color:var(--acc)}
main{max-width:1100px;margin:auto;padding:44px 18px 80px}
section{display:none}section.on{display:block}
.hero{text-align:center;margin-bottom:36px}
.hero h1{font-size:clamp(38px,9vw,76px);letter-spacing:.22em;color:#cfcfd8}
.run{display:inline-flex;gap:8px;align-items:center;color:var(--acc);letter-spacing:.2em;font-weight:600;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.off{background:#f44;box-shadow:0 0 8px #f44}.dot.wait{background:#888;box-shadow:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.stat{text-align:center;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.stat small,.lbl{color:var(--mut);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.stat b{font-size:26px}
h2{font-size:26px;letter-spacing:.06em;text-transform:uppercase;border-left:4px solid var(--acc);padding-left:16px;margin-bottom:6px}
.sub{color:var(--mut);margin:0 0 24px 20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 4px;border-top:1px solid var(--line)}
.green{color:var(--ok);font-weight:600}.gold{color:var(--gold)}
.bar{height:6px;border-radius:9px;background:#2a2a38;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
input[type=search]{width:100%;padding:18px 22px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:#fff;font:inherit;margin-bottom:20px}
.cta{text-align:center}.cta .ic{font-size:44px;margin-bottom:6px}.cta p{color:var(--mut);margin:6px 0 22px}
.btn{display:block;width:100%;padding:15px;margin-top:12px;border-radius:14px;border:1px solid var(--line);background:#101016;color:#fff;font:inherit;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;text-align:center}
.btn.w{background:#fff;color:#000}.btn.d{background:#5865f2;border:0}.btn.g{background:#25d366;color:#000;border:0}
.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.tag{font-size:12px;color:var(--mut);text-align:center;margin-top:30px}
</style></head><body>
<nav id="nav"></nav>
<main>
<section id="home"></section><section id="dashboard"></section><section id="players"></section>
<section id="achievements"></section><section id="community"></section><section id="download"></section>
<p class="tag" id="src"></p>
</main>
<script>
// ===== EDIT ME =====
const CFG={name:"ASHGTPS",guide:"https://dash.gtps.cloud/how-to-play/1475",
 apk:"https://dash.gtps.cloud/how-to-play/1475",powertunnelReleases:"https://github.com/krlvm/PowerTunnel-Android/releases",achTotal:100,discord:"https://discord.gg/6z6kqqbCsw",whatsapp:"https://chat.whatsapp.com/KmChNu8hpBVDndplmjmHKA?s=cl&p=a&mlu=4&ilr=4&iam=0",tiktok:"",
 hostUrl:"your.host.url",surgeHost:"your.surge.host",hostsIp:"5.39.13.18",
 surge:"#",patch:"#",api:"/api/status",refreshMs:15000};
// Empty state shown only until the first answer from the server arrives
const EMPTY={running:null,playersOnline:null,uptimeSeconds:0,event:null,topWorld:null,gemMultiplier:null,xpMultiplier:null,
 registryItems:null,roleQuest:null,registeredAccounts:null,activeWorlds:null,worldHub:null,richest:[],players:[],achievements:[]};
// ===================
const $=s=>document.querySelector(s),esc=s=>s==null?"—":String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"—":Number(n).toLocaleString("en-US"),T0={t:Date.now()};
let D=EMPTY,live=false;
const PAGES=[["home","Home"],["dashboard","Dashboard"],["players","Players"],["achievements","Achievements"],["community","Community"],["download","Download"]];
$("#nav").innerHTML=PAGES.map(([id,l])=>`<a href="#${id}" data-p="${id}">${l}</a>`).join("");
const stat=(l,v,c="")=>`<div class="card stat"><small>${l}</small><b ${c}>${v}</b></div>`;
const up=()=>{let s=Math.floor(D.uptimeSeconds+(Date.now()-T0.t)/1000);return`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m ${s%60}s`};
const mx=v=>v==null?"—":v+"x",ls=(a,f)=>a&&a.length?a.map(f).join(""):'<p class="sub" style="margin:12px 0 0">Not available yet.</p>';
const bar2=(l,v,u,p)=>`<div class="card stat"><small>${l}</small><b>${v}</b><div style="text-align:left"><small>${u}</small><span style="float:right;color:var(--acc);font-size:12px">${p}%</span><div class="bar"><i style="width:${Math.min(100,p)}%;background:var(--acc);box-shadow:none"></i></div></div></div>`;
const sys=s=>`<div class="grid" style="margin-top:16px">${bar2("Memory usage",fmt(s.memUsed)+" MB","usage",Math.round(s.memUsed/s.memMax*100))}${bar2("CPU load",s.cpu.toFixed(1)+"%","processing",Math.round(s.cpu/s.cpuMax*100))}${bar2("Storage usage",(s.storageUsed/1024).toFixed(2)+" GB","disk space",Math.round(s.storageUsed/s.storageMax*100))}</div>`;
const lock=p=>[["BBGL",p.bbgl],["BGL",p.bgl],["DL",p.dl],["WL",p.wl]].filter(x=>x[1]).map(x=>x[1]+" "+x[0]).join(" ")||"0 WL";
function render(){const qv=($("#q")||{}).value||"";
 $("#home").innerHTML=`<div class="hero"><h1>${esc(D.name||CFG.name)}</h1><span class="run"><i class="dot ${D.running?"":D.running===null?"wait":"off"}"></i>${D.running?"SERVER RUNNING":D.running===null?"CONNECTING...":"SERVER OFFLINE"}</span></div>
 <div class="grid">${stat("Players online",fmt(D.playersOnline))}<div class="card stat"><small>Server uptime</small><b id="up">${up()}</b></div>
 ${stat("Active event",esc(D.event),'style="color:#ff2d95;font-size:20px"')}${stat("Top world",esc(D.topWorld),'style="color:var(--acc)"')}
 ${stat("Gem multiplier",mx(D.gemMultiplier),'style="color:#ffe600"')}${stat("XP multiplier",mx(D.xpMultiplier),'style="color:#2bff2b"')}
 ${stat("Active worlds",fmt(D.activeWorlds))}${stat("Total registry items",fmt(D.registryItems))}${stat("Today's role quest",esc(D.roleQuest),'style="color:#a855f7"')}</div>`;
 $("#dashboard").innerHTML=`<h2>Server Economy</h2><p class="sub">Real-time data and economic turnover statistics.</p>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><span class="lbl">Total registered accounts</span><br><b style="font-size:32px">${fmt(D.registeredAccounts)}</b></div>
 <div class="card"><span class="lbl">World activity hub</span><br><b style="font-size:32px;color:var(--acc)">${D.worldHub?esc(D.worldHub.name)+" ("+D.worldHub.players+" Players)":fmt(D.activeWorlds)+" active"}</b></div></div>
 ${D.system?sys(D.system):""}
 <h2 style="margin-top:44px">Leaderboard</h2><p class="sub">Ranking of the most influential players.</p>
 <div class="card"><span class="lbl">Top 3 richest players</span>${ls((D.richest||[]).slice(0,3),(p,i)=>`<div class="row"><span><b class="gold">#${i+1}</b>&nbsp;&nbsp;<b>${esc(p.name)}</b></span><span class="green">${lock(p)}</span></div>`)}</div>`;
 $("#players").innerHTML=`<h2>Players</h2><p class="sub">Who is around right now.</p><div class="card">${ls(D.players,p=>`<div class="row"><b>${esc(p.name)}</b><span>Lv ${p.level}</span><span class="${p.online?"green":""}">${p.online?"ONLINE":"OFFLINE"}</span></div>`)}</div>`;
 $("#achievements").innerHTML=`<h2>Hall of Fame</h2><p class="sub">Tracking player accomplishments and milestones.</p><input type="search" id="q" placeholder="Search champion name...">
 <div class="card" id="ach"></div>`;
 $("#q").value=qv;$("#q").oninput=ach;ach();
 const c=(ic,t,d,b)=>`<div class="card cta"><div class="ic">${ic}</div><h3>${t}</h3><p>${d}</p>${b}</div>`,L=(u,k,t)=>`<a class="btn ${k}" href="${u}" target="_blank" rel="noopener" ${u&&u!=="#"?"":'aria-disabled="true"'}>${t}</a>`;
 $("#community").innerHTML=`<div class="hero"><h2 style="border:0;padding:0;font-size:40px">Community <span style="color:var(--acc)">Hub</span></h2><p class="sub" style="margin:8px 0">Join our official channels.</p></div><div class="grid">
 ${c("💬","Discord","Patch notes, giveaways and staff chat.",L(CFG.discord,"d","Join server"))}${c("📱","WhatsApp","Fast trading and real-time discussion.",L(CFG.whatsapp,"g","Join group"))}${c("🎵","TikTok","Sneak peeks, tutorials and clips.",L(CFG.tiktok,"","Coming soon"))}</div>`;
 const cp=(t,v)=>`<button class="btn" data-copy="${esc(v)}">⧉ ${t}</button>`;
 $("#download").innerHTML=`<div class="hero"><h2 style="border:0;padding:0;font-size:40px">Ready to <span style="color:var(--acc)">play?</span></h2><p class="sub" style="margin:8px 0">Select your device, or open the full step-by-step guide.</p><div style="max-width:360px;margin:16px auto 0">${L(CFG.guide,"w","Open How To Play guide")}</div></div><div class="grid">
 ${c("🤖","Android","Growtopia v5.59+ needs the custom APK, then connect with PowerTunnel.",L(CFG.apk,"w","Download custom APK")+cp("Copy host URL",CFG.hostUrl)+L(CFG.powertunnelReleases,"","Get PowerTunnel"))}
 ${c("🍎","iOS Devices","Connect using Surge 5 profile",cp("Copy Surge host",CFG.surgeHost)+L(CFG.surge,"w","Get Surge 5")+L(CFG.guide,"","Setup guide"))}
 ${c("🪟","Windows","One-click patch or manual host",L(CFG.patch,"w","Download patch")+cp("Copy hosts IP",D.dedicatedIp||CFG.hostsIp)+L(CFG.guide,"","Setup guide"))}
 ${c("🍏","macOS","Follow the official setup guide",L(CFG.guide,"w","Setup guide"))}</div>`;
 $("#src").textContent=!live?"Cannot reach the server API. Retrying every "+CFG.refreshMs/1000+" seconds...":D.partial?"Waiting for the server script (web_stats.lua) to send the remaining stats.":"";
 route()}
function ach(){const q=($("#q")?.value||"").toLowerCase();$("#ach").innerHTML=[...(D.achievements||[])].sort((a,b)=>b.unlocked-a.unlocked).filter(p=>p.name.toLowerCase().includes(q)).map((p,i)=>{const pc=Math.min(100,Math.round(p.unlocked/(D.achievementTotal||CFG.achTotal)*100));return`<div class="row"><b class="gold">#${i+1}</b><b style="flex:1">${esc(p.name)}</b><span class="${p.online?"green":""}">${p.online?"ONLINE":"OFFLINE"}</span><div style="flex:1.4"><small>${p.unlocked} / ${(D.achievementTotal||CFG.achTotal)} unlocked</small><span style="float:right">${pc}%</span><div class="bar"><i style="width:${pc}%"></i></div></div></div>`}).join("")||'<p class="sub">No champions found.</p>'}
function route(){const p=(location.hash||"#home").slice(1),ok=PAGES.some(x=>x[0]===p)?p:"home";document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===ok));document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.p===ok))}
addEventListener("hashchange",route);
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(b){navigator.clipboard.writeText(b.dataset.copy);const o=b.textContent;b.textContent="✓ Copied";setTimeout(()=>b.textContent=o,1200)}});
setInterval(()=>{const u=$("#up");if(u)u.textContent=up()},1000);
async function load(){try{const r=await fetch(CFG.api);if(!r.ok)throw 0;D=await r.json();if(D.site)Object.assign(CFG,D.site);live=true;T0.t=Date.now()}catch{live=false}render()}
load();setInterval(load,CFG.refreshMs);
</script></body></html>
